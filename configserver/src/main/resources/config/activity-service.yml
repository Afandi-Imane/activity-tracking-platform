spring:
  application:
    name: activity-service
  mongodb:
    database: fitnessactivity
    uri: mongodb://localhost:27017/fitnessactivity
  rabbitmq:
    host: localhost
    port: 5673
    username: guest
    password: guest


server:
  port: 8082

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
  instance:
    hostname: localhost
    prefer-ip-address: true


rabbitmq:
  exchange:
     name: fitness.exchange
  queue:
    name: activity.queue
  routing:
    key: activity.tracking